name: Animated Terminal Header

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-header.js"
      - ".github/workflows/header.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render header.svg
        run: node .github/scripts/generate-header.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg
          git diff --staged --quiet || git commit -m "chore: refresh animated header"
          git push

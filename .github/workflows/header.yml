name: Render Profile Visuals

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/header.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # GITHUB_TOKEN lifts the API limit from 60/hr to 5000/hr. The scripts fail
      # hard on a rate limit rather than publishing undercounted stats.
      - name: Render header
        run: node .github/scripts/generate-header.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render stats, rhythm, languages, ticker
        run: node .github/scripts/generate-visuals.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: refresh profile visuals"
          git push

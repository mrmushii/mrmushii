name: Render Profile Visuals

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/header.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # PROFILE_TOKEN is a PAT with `repo` + `read:user`. It is what makes private
      # repos and the contribution calendar visible — the built-in GITHUB_TOKEN
      # can only ever see public data, which understates the real numbers.
      # The scripts fail hard rather than publish public-only stats.
      - name: Render header
        run: node .github/scripts/generate-header.js
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Render stats, rhythm, languages, ticker
        run: node .github/scripts/generate-visuals.js
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --staged --quiet || git commit -m "chore: refresh profile visuals"
          git push
